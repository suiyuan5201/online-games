<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>颜色反应测试 Color Reaction - 免费在线游戏</title>
  <meta name="description" content="免费在线颜色反应速度测试，挑战你的反应极限。Free online color reaction time test.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2030154790924322" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
  .reaction-box{width:100%;height:300px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s;font-size:1.5em;font-weight:700;color:#fff;user-select:none;-webkit-user-select:none}
  .reaction-box.waiting{background:#ef4444}
  .reaction-box.ready{background:#10b981}
  .reaction-box.result{background:#3b82f6}
  .reaction-box.early{background:#f59e0b}
  .history-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:15px}
  .history-item{padding:4px 12px;border-radius:15px;font-size:12px;background:#f0f4ff;color:var(--primary)}
  </style>
</head>
<body>
  <nav class="navbar"><a href="../index.html" class="logo">🎮 游戏合集</a><a href="../index.html" class="nav-link">← 返回</a></nav>
  <div class="game-page">
    <h1 style="text-align:center;margin:20px 0 5px">🎨 颜色反应测试</h1>
    <p style="text-align:center;color:var(--text-light);font-size:14px;margin-bottom:15px">等绿色出现后立刻点击 | Click when it turns green</p>
    <div class="game-container">
      <div class="score-board">
        <div class="score-item"><div class="value" id="lastTime">-</div><div class="label">上次 Last</div></div>
        <div class="score-item"><div class="value" id="bestTime">-</div><div class="label">最佳 Best</div></div>
        <div class="score-item"><div class="value" id="avgTime">-</div><div class="label">平均 Avg</div></div>
      </div>
      <div class="reaction-box waiting" id="box" onclick="handleClick()">
        点击开始<br>Click to Start
      </div>
      <div class="history-list" id="history"></div>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">Free Online Games | 免费在线小游戏 © 2024</footer>
  <script>
  let state='idle',timer,startTime,results=[];
  const best=localStorage.getItem('reaction_best');
  if(best)document.getElementById('bestTime').textContent=best+'ms';
  const box=document.getElementById('box');

  function handleClick(){
    if(state==='idle'){
      state='waiting';
      box.className='reaction-box waiting';
      box.innerHTML='等待绿色...<br>Wait for green...';
      timer=setTimeout(()=>{
        state='ready';
        box.className='reaction-box ready';
        box.innerHTML='点击！<br>CLICK NOW!';
        startTime=Date.now();
      },Math.random()*3000+1500);
    }else if(state==='waiting'){
      clearTimeout(timer);
      state='idle';
      box.className='reaction-box early';
      box.innerHTML='太早了！点击重试<br>Too early! Click to retry';
    }else if(state==='ready'){
      const time=Date.now()-startTime;
      state='idle';
      results.push(time);
      if(results.length>10)results.shift();
      document.getElementById('lastTime').textContent=time+'ms';
      const avg=Math.round(results.reduce((a,b)=>a+b,0)/results.length);
      document.getElementById('avgTime').textContent=avg+'ms';
      const bestVal=localStorage.getItem('reaction_best');
      if(!bestVal||time<parseInt(bestVal)){
        localStorage.setItem('reaction_best',time);
        document.getElementById('bestTime').textContent=time+'ms';
      }
      box.className='reaction-box result';
      box.innerHTML=`${time}ms<br>点击再来一次 | Click to try again`;
      renderHistory();
    }
  }

  function renderHistory(){
    document.getElementById('history').innerHTML=results.map(t=>`<span class="history-item">${t}ms</span>`).join('');
  }
  </script>
</body>
</html>
